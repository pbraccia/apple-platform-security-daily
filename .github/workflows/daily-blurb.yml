name: Update Daily Blurb

on:
  schedule:
    - cron: '37 0 * * *'  # just after midnight UTC (runs on the hour get delayed the most)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the daily blurb files
        run: swift pick_blurb.swift

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.json week.json
          # If it already ran today (e.g. a manual re-run), there's nothing new to commit
          if git diff --cached --quiet; then
            echo "Nothing has changed, skipping commit"
            exit 0
          fi
          git commit -m "Update daily blurb: $(date -u +%Y-%m-%d)"
          git push
