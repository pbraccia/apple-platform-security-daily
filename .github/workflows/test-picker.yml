name: Test picker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  picker:
    name: Picker checks
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and test the picker
        run: python3 tests/test_picker.py
